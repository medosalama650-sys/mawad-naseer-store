<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b32"><title>تفاصيل الطلب | معوض نصير</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f4f6f3;color:#17241b;font-family:Tahoma,Arial,sans-serif;line-height:1.7}.card{max-width:650px;margin:20px auto;background:#fff;border:1px solid #d8e0d8;border-radius:18px;padding:22px;box-shadow:0 8px 28px #10201010}h1{margin:0;color:#174b35;font-size:23px}.muted{color:#5e6e62}.pill{display:inline-block;background:#eaf3ec;border-radius:999px;padding:4px 10px;margin:8px 0}.item{padding:10px 0;border-bottom:1px solid #e7ece7}.btn{display:inline-block;margin:7px 5px 0 0;padding:11px 15px;border-radius:10px;background:#174b35;color:#fff;text-decoration:none}.btn.gold{background:#b88b2d;color:#111}.warn{background:#fff6df;padding:12px;border-radius:10px;font-size:13px}@media print{body{background:#fff;padding:0}.card{box-shadow:none;margin:0;max-width:none}.btn{display:none}}
</style></head><body><main class="card"><h1>معوض نصير ستور</h1><div class="muted">صفحة بيانات الطلب المرفقة بفاتورة QR</div><div id="content" class="muted">جارٍ قراءة بيانات الطلب…</div></main>
<script>
const root=document.getElementById('content');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
try{const token=location.hash.slice(1);if(!token)throw new Error('missing');const bytes=Uint8Array.from(atob(token.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const data=JSON.parse(new TextDecoder().decode(bytes));if(!data||!data.code)throw new Error('invalid');const items=Array.isArray(data.items)?data.items:[];const maps=Number.isFinite(data.lat)&&Number.isFinite(data.lng)?'https://www.google.com/maps?q='+encodeURIComponent(data.lat+','+data.lng):'';const phone=String(data.phone||'').replace(/[^0-9+]/g,'');const tel=phone.replace(/[^0-9]/g,'');root.innerHTML='<div class="pill">رقم الطلب: <b>'+esc(data.code)+'</b></div><p><b>العميل:</b> '+esc(data.buyer||'غير مسجل')+'<br><b>الهاتف:</b> '+esc(data.phone||'غير مسجل')+'<br><b>الحالة وقت إصدار الفاتورة:</b> '+esc(({new:'جديد',contacted:'تم التواصل',confirmed:'مؤكد',preparing:'قيد التجهيز',ready:'جاهز للشحن',out_for_delivery:'خرج للتوصيل',delivered:'تم التسليم',completed:'مكتمل',cancelled:'ملغي'})[data.status]||data.status||'جديد')+'</p><h3>الأصناف</h3>'+items.map(i=>'<div class="item">'+esc(i.name||'صنف')+' — الكمية: '+esc(i.qty)+' — '+(Number(i.unitPrice)>0?esc(i.unitPrice)+' جنيه':'السعر عند التأكيد')+'</div>').join('')+'<p><b>السعر النهائي:</b> '+(data.finalPrice!==null&&data.finalPrice!==undefined?esc(data.finalPrice)+' جنيه':'لم يحدد بعد')+'</p>'+(data.notes?'<p><b>ملاحظات:</b> '+esc(data.notes)+'</p>':'')+(phone?'<a class="btn" href="tel:'+esc(tel)+'">اتصال بالعميل</a>':'')+(maps?'<a class="btn gold" target="_blank" rel="noopener" href="'+maps+'">فتح الموقع والاتجاهات</a>':'<p class="warn">لا يوجد موقع محفوظ لهذا الطلب.</p>')+'<p class="warn">هذه الصفحة تعرض البيانات المضمّنة في رمز QR الموجود على الفاتورة. احتفظ بالفاتورة ولا تشاركها إلا مع الشخص المسؤول عن التوصيل.</p>'}catch(e){root.innerHTML='<p>الرابط غير مكتمل أو بيانات رمز QR غير صالحة. افتح رمز QR الموجود على الفاتورة مرة أخرى.</p>'}
</script></body></html>
